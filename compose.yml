services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ${POSTGRES_DATA_DIR}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: payment-reminder:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Inside the compose network PostgreSQL is reachable as "postgres".
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # The "local" profile makes planning/delivery run every 10s and sets
      # notification-time to 00:00 so notifications appear immediately.
      # Set SPRING_PROFILES_ACTIVE= (empty) for production-like scheduling.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      APP_TIME_ZONE: ${APP_TIME_ZONE}
      APP_NOTIFICATION_TIME: ${APP_NOTIFICATION_TIME}
      REMINDER_SCHEDULER_CRON: ${REMINDER_SCHEDULER_CRON}
      APP_PLANNING_CRON: ${APP_PLANNING_CRON}
      APP_DELIVERY_CRON: ${APP_DELIVERY_CRON}
      APP_DELIVERY_LEASE: ${APP_DELIVERY_LEASE}
      APP_DELIVERY_BATCH: ${APP_DELIVERY_BATCH}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      APP_POLLING_ENABLED: ${APP_POLLING_ENABLED}
      APP_POLLING_DELAY_MS: ${APP_POLLING_DELAY_MS}
      TELEGRAM_MAX_ATTEMPTS: ${TELEGRAM_MAX_ATTEMPTS}
      TELEGRAM_RETRY_DELAY: ${TELEGRAM_RETRY_DELAY}
      TELEGRAM_CONNECT_TIMEOUT: ${TELEGRAM_CONNECT_TIMEOUT}
      TELEGRAM_READ_TIMEOUT: ${TELEGRAM_READ_TIMEOUT}
      TELEGRAM_POLLING_TIMEOUT: ${TELEGRAM_POLLING_TIMEOUT}
    ports:
      - "127.0.0.1:8080:8080"
